
spring.application.name=CGRSBackend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/cgrs_mobile
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=cgrs_secret_key_for_jwt_signing_2025_secure_256bit

# ── Phase 3: Escalation System ────────────────────────────────────────────────
# Number of days after which an unresolved grievance is automatically escalated.
cgrs.escalation.threshold-days=7

# Cron schedule for the escalation job (default: every day at 02:00 AM).
# Format: second minute hour day-of-month month day-of-week
# To test immediately, change to: 0 * * * * *  (every minute)
cgrs.escalation.cron=0 0 2 * * *

# ── Phase 3: Logging ──────────────────────────────────────────────────────────
# Show ESCALATION and NOTIFICATION log entries at WARN and INFO levels
logging.level.Backend.CGRSBackend.service.EscalationService=INFO
logging.level.Backend.CGRSBackend.service.NotificationService=INFO
