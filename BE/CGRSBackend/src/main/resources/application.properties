# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=CGRSBackend
server.port=8080

# ─────────────────────────────────────────────
# PostgreSQL Database
# Update username/password to match your local setup
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cgrs
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# update = auto-creates / updates tables on startup
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────────
# JWT
# Use a strong secret (min 32 chars for HS256)
# ─────────────────────────────────────────────
jwt.secret=cgrs_secret_key_for_jwt_signing_2025_secure_256bit
